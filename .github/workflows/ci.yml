name: Continuous Integration
on:
  - pull_request
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - parallel:
        - name: Checkout code
          uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
          with:
            persist-credentials: false

        - name: Install go
          uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
          with:
            go-version: stable

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  build-binary:
    name: Build binary
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: windows
            arch: amd64
            runner: windows-2025
          - os: windows
            arch: arm64
            runner: windows-11-arm
    steps:
      - parallel:
        - name: Checkout code
          uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
          with:
            persist-credentials: false

        - name: Set up Go
          uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
          with:
            go-version: stable
            cache: false

        - name: Generate filenames
          id: generate-filename
          shell: bash
          run: |
            # Get repo name
            REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)

            # Get version
            VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')

            # Set output
            echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
            echo "BINARY_NAME=${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Get Git commit timestamps
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT

      - name: Build binary
        run: go build -trimpath -a -o "${BINARY_NAME}" -ldflags "-w -X main.version=${GITHUB_REF_NAME} -X main.buildTime=${TIMESTAMP} -extldflags '-static'" cmd/as212510/main.go
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          BINARY_NAME: ${{ steps.generate-filename.outputs.BINARY_NAME }}
          TIMESTAMP: ${{ env.TIMESTAMP }}

  build-docker:
    name: Build docker
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - parallel:
        - name: Checkout code
          uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
          with:
            persist-credentials: false

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Get Git commit timestamps
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: ${{ matrix.os }}/${{ matrix.arch }}
          push: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.TIMESTAMP }}
            VERSION=${{ github.ref_name }}
